plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
}

fabricApi {
    // Runs the shared GameTests (common gametest/) on a headless server.
    configureTests {
        createSourceSet = false
        modId = mod_id
        enableGameTests = true
        enableClientGameTests = false
        eula = false
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            // `./gradlew :fabric:runClient -Pautopilot` opens the Vellum demo screens, screenshots them and quits.
            if (project.hasProperty('autopilot') || project.hasProperty('tour')) {
                property('vellum.autopilot', 'true')
            }
            // `-Ptour [-PtourGo=<file>]`: the scripted showcase tour for demo videos, in a 1280x720 window
            // (tools/record creates the go-file once it is recording).
            if (project.hasProperty('tour')) {
                property('vellum.tour', 'true')
                if (project.hasProperty('tourGo')) property('vellum.tour.go', project.property('tourGo').toString())
                programArgs('--width', '1280', '--height', '720')
            }
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
