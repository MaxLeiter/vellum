plugins {
    id 'multiloader-loader'
}

// 26.x is unobfuscated and builds with Loom as it is. Older versions are obfuscated: they build with the remapping
// Loom, against Mojang's mappings, and the jar is remapped to intermediary names.
def obfuscated = stonecutter.current.parsed < '26'
apply plugin: obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

if (obfuscated) {
    // java.withSourcesJar() (multiloader-common) ran before Loom was applied, so the plain sources jar is still in the
    // published variant beside Loom's remapped one, which Loom only swaps in for jars added after it: keep the remapped.
    afterEvaluate {
        configurations.named('sourcesElements') {
            outgoing.artifacts.removeIf { it.buildDependencies.getDependencies(null).contains(tasks.sourcesJar) }
        }
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    if (obfuscated) {
        mappings(loom.officialMojangMappings())
        modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
        modImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    } else {
        implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
        implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    }
}

fabricApi {
    // Runs the shared GameTests (common gametest/) on a headless server.
    configureTests {
        createSourceSet = false
        modId = mod_id
        enableGameTests = true
        enableClientGameTests = false
        eula = false
    }
}

loom {
    // Common's access widener, with its Stonecutter comments resolved for this version.
    accessWidenerPath.set(stonecutter.process(rootProject.file("common/src/main/resources/${mod_id}.accesswidener"),
            "build/stonecutter-processed/${mod_id}.accesswidener"))
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            // `./gradlew :fabric:26.3:runClient -Pautopilot` (or :fabric:1.21.1) opens the Vellum demo screens,
            // screenshots them and quits.
            if (project.hasProperty('autopilot') || project.hasProperty('tour')) {
                property('vellum.autopilot', 'true')
            }
            // `-Ptour [-PtourGo=<file>] [-PtourShots]`: the scripted showcase tour for demo videos, in a 1280x720 window
            // (tools/record creates the go-file once it is recording); tourShots saves a screenshot at each beat.
            if (project.hasProperty('tour')) {
                property('vellum.tour', 'true')
                if (project.hasProperty('tourGo')) property('vellum.tour.go', project.property('tourGo').toString())
                if (project.hasProperty('tourShots')) property('vellum.tour.shots', 'true')
                programArgs('--width', '1280', '--height', '720')
            }
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
