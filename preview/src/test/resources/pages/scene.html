<!doctype html>
<html>
<head>
<!-- <scene>: blocks from <block> children (stairs, panes, slabs, water, leaves), a group moved and one faded, an
     entity, and anchors placed over points of the scene, from two cameras. -->
<style>
  body { padding: 6px; display: flex; gap: 6px; background: #1c2230; color: #fff; }
  scene { width: 200px; height: 150px; background: #2c3550; outline: 1px solid #45507a; }
  scene.top { width: 150px; -mc-pitch: 60deg; -mc-yaw: 45deg; }
  .lifted { -mc-translate: 0 1.5 0; -mc-rotate: 20deg; }
  .ghost { opacity: 0.4; }
  scene-anchor { transform: translate(-50%, -100%); padding: 1px 2px 0; background: rgba(0, 0, 0, 0.6); }
</style>
</head>
<body>
  <scene>
    <block at="0 0 0" state="minecraft:grass_block"></block>
    <block at="1 0 0" state="minecraft:grass_block"></block>
    <block at="2 0 0" state="minecraft:water"></block>
    <block at="0 0 1" state="minecraft:cobblestone"></block>
    <block at="1 0 1" state="minecraft:oak_planks"></block>
    <block at="2 0 1" state="minecraft:water"></block>
    <block at="0 0 2" state="minecraft:stone_bricks"></block>
    <block at="1 0 2" state="minecraft:oak_stairs[facing=east]"></block>
    <block at="2 0 2" state="minecraft:sand"></block>
    <block at="0 1 0" state="minecraft:oak_log[axis=y]"></block>
    <block at="0 2 0" state="minecraft:oak_leaves"></block>
    <block at="0 1 2" state="minecraft:glass_pane[north=true,south=true]"></block>
    <block at="1 1 2" state="minecraft:stone_slab[type=bottom]"></block>
    <block-group class="lifted"><block at="2 1 0" state="minecraft:gold_block"></block></block-group>
    <block-group class="ghost"><block at="1 1 0" state="minecraft:diamond_block"></block></block-group>
    <entity type="minecraft:villager" at="1.5 1 1.5"></entity>
    <scene-anchor at="2.5 3 0.5">gold</scene-anchor>
  </scene>
  <scene class="top">
    <block at="0 0 0" state="minecraft:oak_fence[east=true]"></block>
    <block at="1 0 0" state="minecraft:oak_fence[east=true,west=true]"></block>
    <block at="2 0 0" state="minecraft:oak_fence[west=true,south=true]"></block>
    <block at="2 0 1" state="minecraft:oak_fence[north=true]"></block>
    <block at="0 0 2" state="minecraft:furnace[facing=south,lit=true]"></block>
    <scene-anchor at="0.5 1 2.5">furnace</scene-anchor>
  </scene>
</body>
</html>
