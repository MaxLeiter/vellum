<!doctype html>
<html>
<head>
<!-- <scene>: blocks from <block> children (stairs, panes, slabs, water, leaves), a group moved and one faded, an
     entity, and anchors placed over points of the scene, from two cameras. -->
<style>
  body { padding: 6px; display: flex; gap: 6px; background: #1c2230; color: #fff; }
  scene { width: 200px; height: 150px; background: #2c3550; outline: 1px solid #45507a; }
  scene.top { width: 150px; -mc-pitch: 60deg; -mc-yaw: 45deg; }
  .lifted { -mc-translate: 0 1.5 0; -mc-yaw: -20deg; }
  .ghost { opacity: 0.4; }
  scene-anchor { transform: translate(-50%, -100%); padding: 1px 2px 0; background: rgba(0, 0, 0, 0.6); }
</style>
</head>
<body>
  <scene>
    <block x="0" y="0" z="0" state="minecraft:grass_block"></block>
    <block x="1" y="0" z="0" state="minecraft:grass_block"></block>
    <block x="2" y="0" z="0" state="minecraft:water"></block>
    <block x="0" y="0" z="1" state="minecraft:cobblestone"></block>
    <block x="1" y="0" z="1" state="minecraft:oak_planks"></block>
    <block x="2" y="0" z="1" state="minecraft:water"></block>
    <block x="0" y="0" z="2" state="minecraft:stone_bricks"></block>
    <block x="1" y="0" z="2" state="minecraft:oak_stairs[facing=east]"></block>
    <block x="2" y="0" z="2" state="minecraft:sand"></block>
    <block x="0" y="1" z="0" state="minecraft:oak_log[axis=y]"></block>
    <block x="0" y="2" z="0" state="minecraft:oak_leaves"></block>
    <block x="0" y="1" z="2" state="minecraft:glass_pane[north=true,south=true]"></block>
    <block x="1" y="1" z="2" state="minecraft:stone_slab[type=bottom]"></block>
    <block-group class="lifted"><block x="2" y="1" z="0" state="minecraft:gold_block"></block></block-group>
    <block-group class="ghost"><block x="1" y="1" z="0" state="minecraft:diamond_block"></block></block-group>
    <entity type="minecraft:villager" x="1.5" y="1" z="1.5"></entity>
    <scene-anchor x="2.5" y="3" z="0.5">gold</scene-anchor>
  </scene>
  <scene class="top">
    <block x="0" y="0" z="0" state="minecraft:oak_fence[east=true]"></block>
    <block x="1" y="0" z="0" state="minecraft:oak_fence[east=true,west=true]"></block>
    <block x="2" y="0" z="0" state="minecraft:oak_fence[west=true,south=true]"></block>
    <block x="2" y="0" z="1" state="minecraft:oak_fence[north=true]"></block>
    <block x="0" y="0" z="2" state="minecraft:furnace[facing=south,lit=true]"></block>
    <scene-anchor x="0.5" y="1" z="2.5">furnace</scene-anchor>
  </scene>
</body>
</html>
