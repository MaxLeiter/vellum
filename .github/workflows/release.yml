name: Release

# Pushing a tag v<version> (the version in gradle.properties) builds Vellum, makes a GitHub release with the jars
# and the version's CHANGELOG.md section, publishes the Maven artifacts to maven.maxleiter.com, then uploads the jars
# to Modrinth and CurseForge. Each upload is skipped, with a warning, while its secret (MAVEN_DEPLOY_KEY,
# MODRINTH_TOKEN, CURSEFORGE_TOKEN) isn't set.
#
# Run it by hand ("Run workflow") for a dry run, which builds and shows what it would upload. Run it by hand on a tag
# with dry run off to redo a release: the GitHub release's jars and notes are replaced, and "skip stores" leaves
# Modrinth and CurseForge alone (for a version already uploaded there).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (build and show the uploads, upload nothing)
        type: boolean
        default: true
      skip_stores:
        description: Skip Modrinth and CurseForge (only make the GitHub release)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      SKIP_STORES: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_stores }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the version
        id: version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in gradle.properties ($version). Tag v$version, or change the version."
              exit 1
            fi
          elif [ "$DRY_RUN" != true ]; then
            echo "::error::Only a tag publishes. Run this from tag v$version, or as a dry run."
            exit 1
          fi
          for loader in neoforge fabric; do
            if ! grep -q "^vellum_version=$version$" "template/$loader/gradle.properties"; then
              echo "::error::template/$loader/gradle.properties should have vellum_version=$version, so new mods start on this release."
              exit 1
            fi
          done
          if ! grep -q "^## $version\b" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section."
            exit 1
          fi
          # Pre-release on GitHub unless the version is a release (no -alpha/-beta suffix and release_type=release).
          release_type=$(sed -n 's/^release_type=//p' gradle.properties | tr -d '[:space:]')
          case "$version" in
            *-alpha*|*-beta*) prerelease=true ;;
            *) [ "$release_type" = release ] && prerelease=false || prerelease=true ;;
          esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # Gradle provisions the per-version toolchains (Java 25 for 26.3 and 26.2, Java 21 for 1.21.1) itself; this JDK runs Gradle.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew build --stacktrace

      - name: Collect the jars and release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp neoforge/versions/*/build/libs/vellum-*-"$VERSION".jar fabric/versions/*/build/libs/vellum-*-"$VERSION".jar dist/
          ls -l dist
          # A NeoForge and a Fabric jar for each Minecraft version.
          expected=$(find neoforge/versions fabric/versions -mindepth 1 -maxdepth 1 -type d | wc -l)
          test "$(find dist -name '*.jar' | wc -l)" -eq "$expected"
          # This version's section of CHANGELOG.md, without its heading, then where to get it and which jar is which.
          {
            awk -v v="$VERSION" '$0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md
            echo
            echo "Also on [Modrinth](https://modrinth.com/mod/vellum-gui) and [CurseForge](https://www.curseforge.com/minecraft/mc-mods/vellum-gui)."
            echo
            echo "| Jar | Loader | Minecraft |"
            echo "|---|---|---|"
            for jar in dist/*.jar; do
              name=$(basename "$jar")
              loader=$(echo "$name" | cut -d- -f2)
              mc=$(echo "$name" | cut -d- -f3)
              case "$loader" in neoforge) loader=NeoForge ;; fabric) loader="Fabric (needs Fabric API)" ;; esac
              echo "| \`$name\` | $loader | $mc |"
            done
            echo
            echo "For mod developers, the \`dev.vellum\` artifacts are on https://maven.maxleiter.com. See [setup](https://github.com/MaxLeiter/vellum/blob/main/docs/api/setup.md)."
          } > dist/notes.md
          cat dist/notes.md

      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            dist/
            neoforge/versions/*/build/publishMods/
            fabric/versions/*/build/publishMods/
          if-no-files-found: warn

      - name: GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            # A rerun: replace the jars and notes.
            gh release upload "v$VERSION" dist/*.jar --clobber
            gh release edit "v$VERSION" --title "Vellum $VERSION" --notes-file dist/notes.md --prerelease="$PRERELEASE"
          else
            flags=()
            [ "$PRERELEASE" = true ] && flags+=(--prerelease)
            gh release create "v$VERSION" dist/*.jar --title "Vellum $VERSION" --notes-file dist/notes.md --verify-tag "${flags[@]}"
          fi

      # maven.maxleiter.com is the MaxLeiter/maven repo on GitHub Pages. MAVEN_DEPLOY_KEY is a deploy key with write
      # access to it.
      - name: Publish to maven.maxleiter.com
        if: env.DRY_RUN != 'true'
        env:
          MAVEN_DEPLOY_KEY: ${{ secrets.MAVEN_DEPLOY_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$MAVEN_DEPLOY_KEY" ]; then
            echo "::warning::MAVEN_DEPLOY_KEY isn't set, so nothing was published to maven.maxleiter.com."
            exit 0
          fi
          key="$RUNNER_TEMP/maven_key"
          printf '%s\n' "$MAVEN_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:MaxLeiter/maven.git "$RUNNER_TEMP/maven"
          ./gradlew publishAllPublicationsToVellumMavenRepository -Pvellum_maven_dir="$RUNNER_TEMP/maven" --stacktrace
          cd "$RUNNER_TEMP/maven"
          git add -A
          if git diff --cached --quiet; then
            echo "maven.maxleiter.com already has Vellum $VERSION."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "Vellum $VERSION"
            git push
          fi

      - name: Publish to Modrinth and CurseForge
        if: env.SKIP_STORES != 'true'
        env:
          PUBLISH_DRY_RUN: ${{ env.DRY_RUN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if [ "$PUBLISH_DRY_RUN" != true ] && { [ -z "$MODRINTH_TOKEN" ] || [ -z "$CURSEFORGE_TOKEN" ]; }; then
            echo "::warning::MODRINTH_TOKEN or CURSEFORGE_TOKEN isn't set, so nothing was uploaded to Modrinth or CurseForge."
            exit 0
          fi
          ./gradlew publishMods --stacktrace
