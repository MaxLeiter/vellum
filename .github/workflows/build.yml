name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # Gradle provisions the per-version toolchains (Java 25 for 26.3 and 26.2, Java 21 for 1.21.1) itself; this JDK runs Gradle.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle, the Minecraft artifacts and the pinned Rhino source archive (in the Gradle user home).
      - uses: gradle/actions/setup-gradle@v5

      # Engine and previewer tests, both Minecraft versions on both loaders, and Fabric's GameTests.
      - run: ./gradlew build --stacktrace

      # The example mods in template/, against this Vellum rather than the released one, so an API change can't
      # break them unnoticed.
      - name: Build the templates
        run: |
          ./gradlew publishToMavenLocal --stacktrace
          version=$(sed -n 's/^version=//p' gradle.properties)
          for loader in neoforge fabric; do
            (cd template/$loader && ./gradlew build -I "$GITHUB_WORKSPACE/.github/local-vellum.gradle" -Pvellum_version="$version" --stacktrace)
          done

      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        with:
          name: jars
          path: |
            neoforge/versions/*/build/libs/*.jar
            fabric/versions/*/build/libs/*.jar
          if-no-files-found: warn
