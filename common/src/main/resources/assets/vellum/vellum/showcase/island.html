<!doctype html>
<html>
<head>
  <title>Skyhaven</title>
  <link rel="stylesheet" href="showcase.css">
  <style>
    /*
     * SKYHAVEN: a title screen with a living island behind the menu. The island is a <scene> (tools/scene_island.py)
     * turning slowly on a CSS animation of -mc-yaw. Villagers and animals are <entity> children walked from point
     * to point by the script on -mc-translate transitions; the boats bob on @keyframes. One day cycle, --day, drives
     * the sky layers, the scene's -mc-tint (so night darkens the blocks), and the lantern glows, stars and
     * fireflies, which only show at night. Smoke from the chimney and the glows are <scene-anchor>s, so they turn
     * with the island.
     */
    :root {
      --day: 96s linear infinite;
      --ink: #f6f3ea;
      --gold: #ffd36b;
    }

    body {
      position: relative;
      color: var(--ink);
      background: #0a1030;
    }

    /* ---------- The sky ---------- */

    .sky, .stars, .clouds { position: absolute; inset: 0; pointer-events: none; }
    .sky.day { background: linear-gradient(#4a86d8, #8cbcf0 50%, #d6ecff 82%, #f4f8ff); }

    .sky.dusk {
      background: linear-gradient(#2a2a6e, #6a3f8f 35%, #e0708a 62%, #ffb070 84%, #ffd890);
      animation: dusk var(--day);
    }

    .sky.night {
      background: linear-gradient(#050822, #0c1440 50%, #1c2460 85%, #2a2e70);
      animation: night var(--day);
    }

    @keyframes dusk {
      0%, 36%, 60%, 82%, 100% { opacity: 0; }
      48% { opacity: 1; }
      91% { opacity: 0.75; }
    }

    @keyframes night {
      0%, 49%, 96%, 100% { opacity: 0; }
      58%, 84% { opacity: 1; }
    }

    /* Anything that only shows at night: stars, glows, fireflies. */
    @keyframes nightly {
      0%, 50%, 93%, 100% { opacity: 0; }
      59%, 84% { opacity: 1; }
    }

    .stars { animation: nightly var(--day); }
    .stars i, .clouds i { position: absolute; display: block; }

    .stars i {
      width: 1px;
      height: 1px;
      background: #fff;
      animation: twinkle 3s ease-in-out infinite alternate;
    }

    .stars i.big { width: 2px; height: 2px; background: #fff6d8; }

    @keyframes twinkle { to { opacity: 0.2; } }

    /* The sun sets behind the island and comes back up at dawn; the moon crosses the night. */
    .sun, .moon { position: absolute; display: block; }

    .sun {
      right: 14%;
      top: 12%;
      width: 18px;
      height: 18px;
      background: #fff8d0;
      border: 2px solid #ffe08a;
      box-shadow: 0 0 0 4px rgba(255, 220, 130, 0.3), 0 0 18px 10px rgba(255, 190, 90, 0.3);
      animation: sun var(--day);
    }

    @keyframes sun {
      0%, 30% { opacity: 1; transform: translateY(0); background-color: #fff8d0; }
      50% { opacity: 1; transform: translateY(150px); background-color: #ff9a52; }
      55%, 85% { opacity: 0; transform: translateY(190px); }
      92% { opacity: 1; transform: translateY(80px); background-color: #ffb070; }
      100% { opacity: 1; transform: translateY(0); background-color: #fff8d0; }
    }

    .moon {
      left: 58%;
      top: 10%;
      width: 12px;
      height: 12px;
      background: linear-gradient(#c3c8da, #c3c8da) 2px 3px / 3px 3px no-repeat,
        linear-gradient(#cfd4e4, #cfd4e4) 7px 7px / 2px 2px no-repeat, #eef1f8;
      box-shadow: 0 0 0 2px rgba(220, 230, 255, 0.15), 0 0 10px 4px rgba(180, 200, 255, 0.25);
      animation: moon var(--day);
    }

    @keyframes moon {
      0%, 48% { opacity: 0; transform: translate(-30px, 60px); }
      60% { opacity: 1; transform: translate(0, 0); }
      84% { opacity: 1; transform: translate(60px, -6px); }
      95%, 100% { opacity: 0; transform: translate(90px, 40px); }
    }

    /* Blocky clouds, drifting across; the near ones pass in front of the island. */
    .clouds i {
      height: 7px;
      background: rgba(255, 255, 255, 0.85);
      border-bottom: 2px solid rgba(160, 180, 220, 0.45);
      animation: cloud-drift linear infinite, cloud-tint var(--day);
    }

    .clouds.near i { height: 10px; background: rgba(255, 255, 255, 0.5); border-bottom-color: rgba(160, 180, 220, 0.3); }

    @keyframes cloud-drift {
      from { transform: translateX(0); }
      to { transform: translateX(-160vw); }
    }

    @keyframes cloud-tint {
      0%, 38% { background-color: rgba(255, 255, 255, 0.85); }
      48% { background-color: rgba(255, 190, 200, 0.85); }
      60%, 84% { background-color: rgba(70, 80, 130, 0.7); }
      92% { background-color: rgba(255, 200, 210, 0.85); }
      100% { background-color: rgba(255, 255, 255, 0.85); }
    }

    /* ---------- The island ---------- */

    scene {
      position: absolute;
      left: 30%;
      top: 0;
      width: 70%;
      height: 100%;
      -mc-pitch: 2deg;
      -mc-model-scale: 1.04;
      -mc-scene-center: 11 6 11;
      animation: spin 160s linear infinite, daylight var(--day);
    }

    @keyframes spin {
      from { -mc-yaw: -70deg; }
      to { -mc-yaw: 290deg; }
    }

    @keyframes daylight {
      0%, 36% { -mc-tint: #ffffff; }
      46% { -mc-tint: #ffd6b0; }
      52% { -mc-tint: #c88ca8; }
      59%, 84% { -mc-tint: #5864a8; }
      91% { -mc-tint: #ffc4b8; }
      100% { -mc-tint: #ffffff; }
    }

    scene-anchor { pointer-events: none; }

    /* Villagers and animals walk on transitions the script sets; boats bob. */
    entity.boat { animation: bob-boat 3.2s ease-in-out infinite; }
    entity.boat.b { animation-duration: 4.1s; animation-delay: -1.3s; }

    @keyframes bob-boat {
      0%, 100% { -mc-translate: 0 0 0; }
      50% { -mc-translate: 0 0.06 0; }
    }

    /* Chimney smoke: soft puffs that rise, drift and swell. */
    .smoke {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(225, 225, 230, 0.7);
      transform: translate(-50%, -50%);
      opacity: 0;
      animation: smoke 4.5s ease-out infinite;
    }

    @keyframes smoke {
      0% { opacity: 0; -mc-translate: 0 0 0; transform: translate(-50%, -50%) scale(0.6); }
      12% { opacity: 0.8; }
      100% { opacity: 0; -mc-translate: 0.7 3.4 0.4; transform: translate(-50%, -50%) scale(2.6); }
    }

    /* Lantern and window light at night. */
    .light {
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at center, rgba(255, 200, 110, 0.75), rgba(255, 160, 60, 0.22) 40%, rgba(255, 160, 60, 0) 70%);
      animation: nightly var(--day);
    }

    .light.window { width: 14px; height: 14px; }

    .firefly {
      width: 2px;
      height: 2px;
      background: #eaff8a;
      box-shadow: 0 0 3px 1px rgba(220, 255, 120, 0.6);
      animation: nightly var(--day), hover-fly 5s ease-in-out infinite alternate;
    }

    @keyframes hover-fly {
      0% { transform: translate(0, 0); }
      50% { transform: translate(4px, -6px); }
      100% { transform: translate(-3px, -2px); }
    }

    /* Darken the left so the menu reads. */
    .scrim {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to right, rgba(6, 10, 30, 0.6), rgba(6, 10, 30, 0.22) 38%, rgba(6, 10, 30, 0) 60%),
        radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.35));
    }

    .fade {
      position: absolute;
      inset: 0;
      background: #000;
      pointer-events: none;
      animation: fade-out 1200ms ease-out both;
    }

    @keyframes fade-out { to { opacity: 0; } }

    /* ---------- The menu ---------- */

    main {
      position: absolute;
      left: 5%;
      top: 0;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }

    .logo {
      position: relative;
      align-self: flex-start;
      animation: logo-in 800ms cubic-bezier(0.2, 0.9, 0.3, 1.2) 300ms both;
    }

    @keyframes logo-in {
      from { opacity: 0; transform: translateY(-16px) scale(1.15); }
    }

    h1 {
      font-size: 32px;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 1px 1px 0 #b9e0ff, 2px 2px 0 #7fb0e0, 3px 3px 0 #4c78b0, 4px 4px 0 #1f3c70;
    }

    /* The letters float, one after another, like the island. */
    h1 span { display: inline-block; animation: float 3.6s ease-in-out infinite; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    .edition {
      position: absolute;
      right: 0;
      top: 100%;
      margin-top: 2px;
      color: #bfe4ff;
      letter-spacing: 2px;
      white-space: nowrap;
      text-shadow: minecraft;
      animation: rise 500ms ease-out 900ms both;
    }

    .splash {
      position: absolute;
      left: calc(100% + 2px);
      top: 36px;
      transform-origin: 0 50%;
      color: mc-yellow;
      text-shadow: minecraft;
      white-space: nowrap;
      transform: translateY(-50%) rotate(-20deg) scale(1.2);
      animation: splash-in 500ms cubic-bezier(0.3, 1.6, 0.5, 1) 1.2s both, splash 900ms ease-in-out 1.7s infinite;
    }

    @keyframes splash-in {
      from { opacity: 0; transform: translateY(-50%) rotate(-20deg) scale(0); }
    }

    @keyframes splash {
      50% { transform: translateY(-50%) rotate(-20deg) scale(1.32); }
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
      padding: 7px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0) 45%), rgba(10, 20, 50, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-top-color: rgba(255, 255, 255, 0.34);
      border-radius: 4px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      animation: panel-in 600ms ease-out 400ms both;
    }

    @keyframes panel-in {
      from { opacity: 0; transform: translateX(-20px); }
    }

    .panel > * { animation: rise 400ms ease-out 550ms backwards; }
    .panel > :nth-child(2) { animation-delay: 620ms; }
    .panel > :nth-child(3) { animation-delay: 690ms; }
    .panel > :nth-child(4) { animation-delay: 760ms; }

    @keyframes rise {
      from { opacity: 0; transform: translateX(-10px); }
    }

    .panel button {
      justify-content: flex-start;
      gap: 6px;
      width: 160px;
      height: 20px;
      padding: 0 4px;
      color: #eef4ff;
      background: rgba(8, 16, 40, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      transition: transform 160ms ease-out, background-color 160ms, border-color 160ms, box-shadow 200ms, color 160ms;
    }

    .panel button:hover, .panel button:focus-visible {
      transform: translateX(4px);
      background: rgba(140, 200, 255, 0.18);
      border-color: rgba(170, 220, 255, 0.75);
      box-shadow: 0 0 8px rgba(120, 190, 255, 0.45);
      color: #fff;
    }

    .panel button:active { transform: translateX(3px) scale(0.98); }
    .panel button:hover item, .panel button:hover player-head { animation: bob 500ms ease-in-out infinite; }
    .panel player-head { width: 12px; height: 12px; margin: 0 2px; }

    .row { display: flex; gap: 4px; }
    .panel .row button { justify-content: center; }
    .panel .row .half { flex: 1; width: auto; }
    .panel .row .icon { width: 20px; padding: 0; }

    footer {
      position: absolute;
      left: 4px;
      right: 4px;
      bottom: 3px;
      display: flex;
      justify-content: space-between;
      color: rgba(255, 255, 255, 0.75);
      text-shadow: minecraft;
      animation: rise 500ms ease-out 1.2s both;
    }

    .clock { color: rgba(255, 255, 255, 0.55); }

    /* A tall GUI scale: a smaller logo. */
    @media (max-height: 280px) {
      h1 { font-size: 16px; letter-spacing: 2px; text-shadow: 1px 1px 0 #7fb0e0, 2px 2px 0 #1f3c70; }
      .splash { top: 18px; }
      .edition { left: 0; right: auto; letter-spacing: 1px; }
      main { gap: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      scene { animation: daylight var(--day); -mc-yaw: -70deg; }
      .clouds i, h1 span, .splash, .smoke { animation: none; }
    }
  </style>
</head>
<body class="fullscreen">
  <div class="sky day"></div>
  <div class="sky dusk"></div>
  <div class="sky night"></div>
  <div class="stars"></div>
  <i class="moon"></i>
  <i class="sun"></i>
  <div class="clouds far"></div>

  <scene structure="vellum:structures/sky_island.nbt" rotatable notooltips>
    <entity class="walker" type="minecraft:villager" data-route="elder" x="0" y="0" z="0"></entity>
    <entity class="walker" type="minecraft:villager" variant="minecraft:savanna" data-route="farmer" x="0" y="0" z="0"></entity>
    <entity class="walker" type="minecraft:sheep" data-route="sheep" x="0" y="0" z="0"></entity>
    <entity class="walker" type="minecraft:sheep" color="pink" data-route="lamb" baby x="0" y="0" z="0"></entity>
    <entity class="walker" type="minecraft:cow" data-route="cow" x="0" y="0" z="0"></entity>
    <entity class="walker" type="minecraft:chicken" data-route="hen" x="0" y="0" z="0"></entity>
    <entity class="walker" type="minecraft:chicken" data-route="chick" baby x="0" y="0" z="0"></entity>
    <entity type="minecraft:cat" variant="minecraft:calico" x="5.3" y="7" z="9.5" style="-mc-yaw: -35deg"></entity>
    <entity class="boat" type="minecraft:oak_boat" x="16.6" y="6.43" z="15.4" style="-mc-yaw: 30deg"></entity>
    <entity class="boat b" type="minecraft:cherry_boat" x="14.6" y="6.43" z="16.6" style="-mc-yaw: -70deg"></entity>

    <scene-anchor class="light" x="10.5" y="8.4" z="9.5"></scene-anchor>
    <scene-anchor class="light" x="10.5" y="8.4" z="11.5"></scene-anchor>
    <scene-anchor class="light" x="13.5" y="8.4" z="12.5"></scene-anchor>
    <scene-anchor class="light" x="6.5" y="9.3" z="9.5"></scene-anchor>
    <scene-anchor class="light window" x="5.5" y="8.5" z="9.05"></scene-anchor>
    <scene-anchor class="light window" x="7.5" y="8.5" z="9.05"></scene-anchor>
    <scene-anchor class="light window" x="8.95" y="8.5" z="5.5"></scene-anchor>
    <scene-anchor class="light window" x="8.95" y="8.5" z="7.5"></scene-anchor>
  </scene>

  <div class="clouds near"></div>
  <div class="scrim"></div>

  <main>
    <div class="logo">
      <h1><span v-for="(letter, i) in 'SKYHAVEN'.split('')" :style="{ animationDelay: -i * 260 + 'ms' }">{{ letter }}</span></h1>
      <div class="edition">A FLOATING VILLAGE</div>
      <div class="splash"></div>
    </div>

    <nav class="panel">
      <button onclick="vellum.close()"><item id="minecraft:cherry_sapling"></item>Singleplayer</button>
      <button><player-head></player-head>Multiplayer</button>
      <button><item id="minecraft:elytra"></item>Minecraft Realms</button>
      <div class="row">
        <button class="icon" title="Language"><sprite src="minecraft:icon/language"></sprite></button>
        <button class="half">Options...</button>
        <button class="half" onclick="vellum.close()">Quit Game</button>
        <button class="icon" title="Accessibility"><sprite src="minecraft:icon/accessibility"></sprite></button>
      </div>
    </nav>
  </main>

  <footer>
    <span>Vellum 1.0 (Minecraft 26.3) <span class="clock"></span></span>
    <span>Drag the island to turn it</span>
  </footer>

  <div class="fade"></div>

  <script>
    // Places a scene child at a point: x, y and z are its attributes.
    function place(el, x, y, z) {
      el.setAttribute('x', x);
      el.setAttribute('y', y);
      el.setAttribute('z', z);
    }

    function seeded(seed) {
      return () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
    }

    function shape(parent, cls, css) {
      const el = document.createElement('i');
      el.className = cls;
      el.style.cssText = css;
      parent.appendChild(el);
      return el;
    }

    const random = seeded(9);
    const stars = document.querySelector('.stars');
    for (let i = 0; i < 48; i++) {
      shape(stars, random() < 0.2 ? 'big' : '', `left:${(random() * 100).toFixed(1)}%; top:${(random() * 70).toFixed(1)}%;
        animation-duration:${(1.5 + random() * 3).toFixed(2)}s; animation-delay:${(-random() * 4).toFixed(2)}s;`);
    }

    // Clouds: each a slab with a smaller one on top, spread over a strip wider than the screen and drifting left.
    // A negative delay starts each part way across, so the sky is full from the first frame.
    function clouds(layer, count, speed, top, bottom, width) {
      for (let i = 0; i < count; i++) {
        const w = Math.round(width * (0.6 + random() * 0.8));
        const y = (top + random() * (bottom - top)).toFixed(1);
        const duration = (speed * (0.8 + random() * 0.4)).toFixed(1);
        const delay = (-random() * duration).toFixed(1);
        const css = `left:105%; top:${y}%; width:${w}px; animation-duration:${duration}s, 96s; animation-delay:${delay}s, var(--day-delay, 0s);`;
        shape(layer, '', css);
        shape(layer, '', css.replace(`top:${y}%`, `top:calc(${y}% - 5px)`).replace(`width:${w}px`, `width:${Math.round(w * 0.5)}px; margin-left:${Math.round(w * 0.2)}px`));
      }
    }
    clouds(document.querySelector('.clouds.far'), 7, 140, 6, 55, 50);
    clouds(document.querySelector('.clouds.near'), 3, 70, 62, 88, 80);

    const scene = document.querySelector('scene');

    // Chimney smoke and fireflies, in the scene so they turn with it.
    for (let i = 0; i < 5; i++) {
      const a = document.createElement('scene-anchor');
      a.className = 'smoke';
      place(a, 7.5, 13.5, 4.5);
      a.style.animationDelay = (-i * 0.9) + 's';
      scene.appendChild(a);
    }
    const FIREFLIES = [[15, 8, 13], [17.5, 7.6, 14], [13, 8.2, 17], [18.5, 9, 10.5], [16, 9.5, 8], [11.5, 8, 13.5],
      [4.5, 8, 11.5], [7.5, 8.4, 13], [12, 9, 3.5], [19, 8, 6]];
    FIREFLIES.forEach((p, i) => {
      const a = document.createElement('scene-anchor');
      a.className = 'firefly';
      place(a, ...p);
      a.style.animationDelay = '0s, ' + (-random() * 5).toFixed(2) + 's';
      scene.appendChild(a);
    });

    // ---- Walkers: each entity follows a loop of points, pausing at some and facing a way there ----

    // Points are where it stands, y 7 being the top of the grass. "face" is a Minecraft yaw (0 south, 90 west).
    const ROUTES = {
      elder: {speed: 1.1, points: [
        {at: [6.5, 7, 9.6], pause: 2500, face: 0},
        {at: [6.5, 7, 10.5]}, {at: [13.5, 7, 10.5]},
        {at: [13.5, 7, 8.9], pause: 2200, face: 180},
        {at: [13.5, 7, 11.4]}, {at: [14.5, 7, 12.4]},
        {at: [14.5, 7, 14.2], pause: 3500, face: -20},
        {at: [14.5, 7, 12.4]}, {at: [13.5, 7, 11.4]}, {at: [13.5, 7, 10.5]}, {at: [6.5, 7, 10.5]}]},
      farmer: {speed: 0.9, points: [
        {at: [3.6, 7, 11.5], pause: 2000, face: 0},
        {at: [6.2, 7, 11.5], pause: 1600, face: 0},
        {at: [8.6, 7, 11.5], pause: 2400, face: 0},
        {at: [6.2, 7, 11.5], pause: 1200, face: 0}]},
      sheep: {speed: 0.5, points: [
        {at: [18.5, 7, 5.5], pause: 4000}, {at: [19.6, 7, 7.2], pause: 3000}, {at: [17.8, 7, 7.0], pause: 5000}]},
      lamb: {speed: 0.6, points: [
        {at: [19.2, 7, 5.0], pause: 2500}, {at: [18.4, 7, 7.6], pause: 3500}, {at: [20.0, 7, 6.6], pause: 2000}]},
      cow: {speed: 0.45, points: [
        {at: [10.5, 7, 16.5], pause: 5000}, {at: [11.6, 7, 14.2], pause: 4000}, {at: [9.6, 7, 15.4], pause: 3000}]},
      hen: {speed: 0.7, points: [
        {at: [10.4, 7, 12.6], pause: 1500}, {at: [11.6, 7, 12.0], pause: 2500}, {at: [11.0, 7, 13.2], pause: 1200}]},
      chick: {speed: 0.8, points: [
        {at: [11.0, 7, 12.4], pause: 1000}, {at: [11.9, 7, 12.9], pause: 2000}, {at: [10.6, 7, 13.0], pause: 1500}]},
    };

    /** The yaw that faces from {@code a} to {@code b}. */
    function yawTowards(a, b) {
      return Math.atan2(-(b[0] - a[0]), b[2] - a[2]) * 180 / Math.PI;
    }

    class Walker {
      constructor(el, route) {
        this.el = el;
        this.route = route;
        this.i = 0;
        this.where = route.points[0].at;
        this.yaw = 0;
        el.style.setProperty('-mc-translate', this.where.join(' '));
        this.turn(route.points[0].face ?? 0);
        // Not all at once: each starts a little after the last.
        setTimeout(() => this.next(), 300 + Math.round(random() * 1500));
      }

      /** Turns to {@code yaw} the short way round (its transition sets how fast). */
      turn(yaw) {
        this.yaw += ((yaw - this.yaw) % 360 + 540) % 360 - 180;
        this.el.style.setProperty('-mc-yaw', this.yaw.toFixed(1) + 'deg');
      }

      next() {
        this.i = (this.i + 1) % this.route.points.length;
        const p = this.route.points[this.i];
        const d = Math.hypot(p.at[0] - this.where[0], p.at[2] - this.where[2]);
        const ms = Math.round(1000 * d / this.route.speed);
        this.el.style.transition = `-mc-translate ${ms}ms linear, -mc-yaw 400ms ease-out`;
        this.turn(yawTowards(this.where, p.at));
        this.el.setAttribute('walk', (0.35 + this.route.speed * 0.5).toFixed(2));
        this.el.style.setProperty('-mc-translate', p.at.join(' '));
        this.where = p.at;
        setTimeout(() => {
          if (!p.pause) return this.next();
          this.el.removeAttribute('walk');
          if (p.face !== undefined) this.turn(p.face);
          setTimeout(() => this.next(), p.pause);
        }, ms);
      }
    }

    scene.querySelectorAll('.walker').forEach(el => new Walker(el, ROUTES[el.dataset.route]));

    // ---- The menu ----

    const splashes = ['Floating since 26.3!', 'Mind the edge!', 'Watch the sunset!', 'Made of blocks!',
      'Watch the villagers!', 'One scene, one draw!', 'Fully HTML!', 'Boats bob!'];
    document.querySelector('.splash').textContent = splashes[Math.floor(Math.random() * splashes.length)];

    // The day's time in the footer, as a Minecraft clock reads it: the cycle starts at 7:00. Opened with
    // {"time": 0.55} (a fraction of the cycle), the page starts that far into it: 0.5 is dusk, 0.7 the night.
    const DAY_MS = 96000;
    const clock = document.querySelector('.clock');
    let start = performance.now();
    function setTime(t) {
      document.documentElement.style.setProperty('--day', `${DAY_MS}ms linear ${-t * DAY_MS}ms infinite`);
      document.documentElement.style.setProperty('--day-delay', `${-t * DAY_MS}ms`);
      start = performance.now() - t * DAY_MS;
    }
    if (typeof vellum.data.time === 'number') setTime(vellum.data.time);
    vellum.on('data', data => { if (typeof data.time === 'number') setTime(data.time); });
    setInterval(() => {
      const day = ((performance.now() - start) / DAY_MS + 7 / 24) % 1;
      const minutes = Math.floor(day * 24 * 60);
      clock.textContent = '  ' + String(Math.floor(minutes / 60)).padStart(2, '0') + ':' + String(minutes % 60 - minutes % 10).padStart(2, '0');
    }, 1000);

    document.querySelectorAll('button').forEach(b => b.addEventListener('mouseenter', () => {
      vellum.playSound('minecraft:ui.button.click', 0.15, 1.8);
    }));
  </script>
</body>
</html>
