<!doctype html>
<html>
<head>
  <title>Vellum title screen</title>
  <link rel="stylesheet" href="showcase.css">
  <style>
    /*
     * A title screen painted entirely with CSS: a dusk sky, square sun, blocky clouds and four parallax ranges
     * (rotated squares, rounded rects and box-shadow spruces). One 60s "day cycle" drives the sky, sun, stars and
     * the hazy far ranges together: every cycle animation uses the same timing, --day, so they stay in step. Its
     * negative delay opens the page half-way through the cycle, at dusk, instead of at the start.
     */
    :root {
      --day: 60s ease-in-out -30s infinite alternate;
      --ink: #f4f1ea;
      --gold: #ffd36b;
    }

    body {
      background: #0d0820;
      color: var(--ink);
    }

    /* ---------- The world ---------- */

    /* Layers that cover the whole screen. */
    .world, .sky, .range, .scrim, .fade { position: absolute; inset: 0; }
    .world { overflow: hidden; }

    /* The world's shapes (sun, moon, stars, birds, peaks, trees...) are absolutely placed <i> elements. */
    .world i { position: absolute; display: block; }

    /* Three stacked skies; the dusk and night layers fade in and out over the cycle. */
    .sky.day { background: linear-gradient(#3d6fc0, #79a6e0 45%, #f3d39b 80%, #ffe6ae); }

    .sky.dusk {
      background: linear-gradient(#1c1645, #46296f 32%, #a83c78 58%, #ee7a4c 78%, #ffc56e 92%);
      animation: dusk var(--day);
    }

    .sky.night {
      background: linear-gradient(#04051a, #0e1240 45%, #2a2160 80%, #45306e);
      animation: night var(--day);
    }

    @keyframes dusk {
      0% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }

    @keyframes night {
      0%, 50% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Stars: generated by the script, each with its own twinkle duration and delay. */
    .stars {
      position: absolute;
      inset: 0 0 35% 0;
      animation: stars var(--day);
    }

    .stars i {
      width: 1px;
      height: 1px;
      background: #fff;
      animation: twinkle 3s ease-in-out infinite alternate;
    }

    .stars i.big { width: 2px; height: 2px; background: #fff7d8; }

    @keyframes stars {
      0% { opacity: 0; }
      50% { opacity: 0.75; }
      100% { opacity: 1; }
    }

    @keyframes twinkle {
      to { opacity: 0.15; }
    }

    /* A shooting star: a short gradient streak that crosses the sky every few seconds. */
    .meteor {
      top: 12%;
      left: 70%;
      width: 28px;
      height: 1px;
      background: linear-gradient(to right, rgba(255, 255, 255, 0), #fff);
      transform: rotate(-24deg);
      animation: meteor 7s ease-in 2s infinite;
      opacity: 0;
    }

    @keyframes meteor {
      0% { opacity: 0; transform: translate(0, 0) rotate(-24deg); }
      3% { opacity: 1; }
      9%, 100% { opacity: 0; transform: translate(-90px, 40px) rotate(-24deg); }
    }

    /* Birds: a 1px box whose box-shadows are the other pixels of a "v". The flap swaps the shadow list for a
       flatter one with steps(1), like a two-frame sprite; the flight is a slow translate across the sky. */
    .bird {
      width: 1px;
      height: 1px;
      background: #1a1028;
      box-shadow: -1px -1px 0 #1a1028, -2px -2px 0 #1a1028, 1px -1px 0 #1a1028, 2px -2px 0 #1a1028;
      animation: flap 360ms steps(1) infinite, fly-across 38s linear infinite;
    }

    @keyframes flap {
      50% { box-shadow: -1px 0 0 #1a1028, -2px 0 0 #1a1028, 1px 0 0 #1a1028, 2px 0 0 #1a1028; }
    }

    @keyframes fly-across {
      to { transform: translate(-480px, -30px); }
    }

    /* The sun is square, like the game's: a hot core, a pale rim and two soft glows (box-shadow, no images). */
    .sun {
      left: 80%;
      top: 38%;
      width: 20px;
      height: 20px;
      background: #fff6c8;
      border: 2px solid #ffe28a;
      box-shadow: 0 0 0 4px rgba(255, 214, 120, 0.35), 0 0 18px 10px rgba(255, 150, 70, 0.35);
      animation: sun var(--day);
    }

    @keyframes sun {
      0% { transform: translateY(-58px); background-color: #fffbe6; border-color: #fff1b0; }
      50% { transform: translateY(0); background-color: #fff2b8; border-color: #ffc15e; }
      100% { transform: translateY(46px); background-color: #ff9a52; border-color: #ff6a3c; }
    }

    /* A wide warm glow on the horizon behind the sun. */
    .glow {
      left: 48%;
      top: 22%;
      width: 72%;
      height: 54%;
      background: radial-gradient(ellipse at center, rgba(255, 190, 110, 0.55), rgba(255, 120, 90, 0.18) 40%, rgba(255, 120, 90, 0) 70%);
      animation: glow var(--day);
    }

    @keyframes glow {
      0% { opacity: 0.35; }
      50% { opacity: 1; }
      100% { opacity: 0.2; }
    }

    /* The moon: square too, with two craters drawn as tiny gradient squares. It rises as night falls. */
    .moon {
      left: 88%;
      top: 9%;
      width: 12px;
      height: 12px;
      background: linear-gradient(#c3c8da, #c3c8da) 2px 3px / 3px 3px no-repeat,
        linear-gradient(#cfd4e4, #cfd4e4) 7px 7px / 2px 2px no-repeat, #eef1f8;
      box-shadow: 0 0 0 2px rgba(220, 230, 255, 0.15), 0 0 10px 4px rgba(180, 200, 255, 0.2);
      animation: moon var(--day);
    }

    @keyframes moon {
      0%, 55% { opacity: 0; transform: translateY(40px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Parallax: each range wraps a strip twice the viewport wide holding two identical tiles. Sliding the strip
       by -50% on repeat loops with no visible seam; each range sets how long a loop takes. The script moves the
       outer .range with the mouse. */
    .range { transition: transform 600ms ease-out; }

    .strip {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 200%;
      height: 100%;
      animation: drift linear infinite;
    }

    .tile {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
    }

    .tile + .tile { left: 50%; }

    @keyframes drift {
      to { transform: translateX(-50%); }
    }

    /* The far, mid and near ranges stand on a flat base, --base high. The script places their shapes against
       the same height. */
    .tile::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--base, 0);
    }

    /* Blocky clouds: flat slabs with a shaded underside, tinted by the cycle. */
    .clouds .strip { animation-duration: 150s; }

    .clouds .tile > i {
      height: 6px;
      border-bottom: 2px solid rgba(80, 40, 90, 0.25);
      opacity: 0.85;
      animation: cloud var(--day);
    }

    @keyframes cloud {
      0% { background-color: #ffffff; }
      50% { background-color: #f6b3bf; }
      100% { background-color: #4c4170; }
    }

    /* Far range: big rotated squares. A half-transparent gradient shades the right face; the snow cap is a
       smaller square tucked into the same top corner (::before), shaded the same way. The snow is translucent,
       so it takes on the peak's animated colour: pink at dusk, grey-blue at night. */
    .far { --base: 34%; }
    .far .strip { animation-duration: 240s; }
    .far .tile::before, .far .tile > i { animation: far var(--day); }

    .far .tile > i {
      transform: rotate(45deg);
      background-image: linear-gradient(225deg, rgba(20, 0, 40, 0.28) 50%, rgba(0, 0, 0, 0) 50%);
    }

    .far .tile > i::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 30%;
      height: 30%;
      background-color: rgba(255, 236, 246, 0.5);
      background-image: linear-gradient(225deg, rgba(60, 0, 60, 0.3) 50%, rgba(0, 0, 0, 0) 50%);
    }

    @keyframes far {
      0% { background-color: #8aa2c8; }
      50% { background-color: #7a4f8f; }
      100% { background-color: #2c2652; }
    }

    /* Mid range: rounded diamonds read as soft, rolling hills. */
    .mid { --base: 30%; }
    .mid .strip { animation-duration: 140s; }
    .mid .tile::before, .mid .tile > i { animation: mid var(--day); }
    .mid .tile > i { transform: rotate(45deg); border-radius: 14px; }

    @keyframes mid {
      0% { background-color: #5a7499; }
      50% { background-color: #4a2c66; }
      100% { background-color: #1c1838; }
    }

    /* Near range: a spruce forest. Each tree is one 2x3 box; every box-shadow (no blur, growing spread) adds a
       wider tier below, which gives the stepped, pixel-art silhouette. */
    .near { --base: 17%; --leaf: #2a1a3c; }
    .near .strip { animation-duration: 80s; }
    .near .tile::before, .tree { background: var(--leaf); }

    /* Tier i is offset 3i px with spread i: it spans y = 2i..4i+3, so six tiers make a tree 27px tall and
       14px wide. Scaling about its foot (1px, 27px) varies the size. */
    .tree {
      width: 2px;
      height: 3px;
      transform-origin: 1px 27px;
      box-shadow: 0 3px 0 1px var(--leaf), 0 6px 0 2px var(--leaf), 0 9px 0 3px var(--leaf), 0 12px 0 4px var(--leaf),
        0 15px 0 5px var(--leaf), 0 18px 0 6px var(--leaf);
    }

    /* A stockier spruce: a 4px box makes every tier 2px wider. */
    .tree.wide { width: 4px; transform-origin: 2px 27px; }

    /* Foreground: voxel columns with a 1px rim of sky light. */
    .front .strip { animation-duration: 50s; }

    .front .tile > i {
      bottom: 0;
      background: #110a1b;
      border-top: 1px solid #4b3468;
    }

    /* Fireflies drift up out of the forest. */
    .flies i {
      width: 1px;
      height: 1px;
      background: #e9ff8a;
      box-shadow: 0 0 2px 1px rgba(220, 255, 120, 0.45);
      opacity: 0;
      animation: fly 6s ease-in-out infinite;
    }

    @keyframes fly {
      0% { opacity: 0; transform: translate(0, 0); }
      20% { opacity: 1; }
      50% { transform: translate(6px, -14px); }
      80% { opacity: 0.8; }
      100% { opacity: 0; transform: translate(-4px, -30px); }
    }

    /* Darken the left side so the menu reads, and the corners for focus. */
    .scrim {
      background: linear-gradient(to right, rgba(8, 4, 20, 0.62), rgba(8, 4, 20, 0.25) 45%, rgba(8, 4, 20, 0) 70%),
        radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.45));
    }

    /* The page fades up from black. */
    .fade {
      background: #000;
      pointer-events: none;
      animation: fade-out 900ms ease-out both;
    }

    @keyframes fade-out {
      to { opacity: 0; }
    }

    /* ---------- The menu ---------- */

    main {
      position: absolute;
      left: 6%;
      top: 0;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
    }

    .logo {
      position: relative;
      align-self: flex-start;
      animation: logo-in 700ms cubic-bezier(0.2, 0.9, 0.3, 1.2) 200ms both;
    }

    @keyframes logo-in {
      from { opacity: 0; transform: translateY(-16px) scale(1.15); }
    }

    /* 32px is the font at 4x: crisp. The extrusion is four 1px shadows, each a step darker. */
    h1 {
      font-size: 32px;
      letter-spacing: 4px;
      text-shadow: 1px 1px 0 #c3b2df, 2px 2px 0 #9580bb, 3px 3px 0 #66518f, 4px 4px 0 #2f2152;
    }

    /* The shimmer: every letter brightens in turn (the template staggers their delays), so a highlight sweeps
       across the word. */
    h1 span { display: inline-block; animation: shimmer 4s ease-in-out infinite; }

    @keyframes shimmer {
      0%, 14%, 100% { color: var(--ink); transform: translateY(0); }
      5% { color: #fff6c0; transform: translateY(-1px); }
      9% { color: var(--gold); }
    }

    .edition {
      position: absolute;
      right: 0;
      top: 100%;
      margin-top: 2px;
      color: var(--gold);
      letter-spacing: 2px;
      text-shadow: minecraft;
      animation: rise 500ms ease-out 700ms both;
    }

    /* The splash: tilted -20deg and pulsing like the vanilla one. It grows out of the end of the edition line
       (transform-origin at its left end), so long splashes rise into the sky instead of covering the logo. */
    .splash {
      position: absolute;
      left: calc(100% + 2px);
      top: 38px;
      transform-origin: 0 50%;
      color: mc-yellow;
      text-shadow: minecraft;
      white-space: nowrap;
      transform: translateY(-50%) rotate(-20deg) scale(1.3);
      animation: splash-in 500ms cubic-bezier(0.3, 1.6, 0.5, 1) 1s both, splash 900ms ease-in-out 1.5s infinite;
    }

    @keyframes splash-in {
      from { opacity: 0; transform: translateY(-50%) rotate(-20deg) scale(0); }
    }

    @keyframes splash {
      50% { transform: translateY(-50%) rotate(-20deg) scale(1.42); }
    }

    /* The glass panel: translucent fill, a lighter top edge, a diagonal sheen and a soft drop shadow. */
    .panel {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
      padding: 8px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0) 45%), rgba(24, 14, 44, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-top-color: rgba(255, 255, 255, 0.32);
      border-radius: 4px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
      animation: panel-in 600ms ease-out 300ms both;
    }

    @keyframes panel-in {
      from { opacity: 0; transform: translateX(-20px); }
    }

    /* The panel's rows rise in one after another. backwards, not both: a finished animation that kept filling
       would pin transform and beat :hover. */
    .panel > * { animation: rise 400ms ease-out 450ms backwards; }
    .panel > :nth-child(2) { animation-delay: 520ms; }
    .panel > :nth-child(3) { animation-delay: 590ms; }
    .panel > :nth-child(4) { animation-delay: 660ms; }

    @keyframes rise {
      from { opacity: 0; transform: translateX(-10px); }
    }

    .panel button {
      justify-content: flex-start;
      gap: 6px;
      width: 168px;
      height: 20px;
      padding: 0 4px;
      background: rgba(10, 6, 24, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      color: #e8e2f2;
      transition: transform 160ms ease-out, background-color 160ms, border-color 160ms, box-shadow 200ms, color 160ms;
    }

    /* Hover: slide right and glow gold. The item icon starts to bob. */
    .panel button:hover, .panel button:focus-visible {
      transform: translateX(4px);
      background: rgba(255, 196, 100, 0.16);
      border-color: rgba(255, 211, 107, 0.7);
      box-shadow: 0 0 8px rgba(255, 180, 80, 0.45);
      color: mc-yellow;
    }

    .panel button:active { transform: translateX(3px) scale(0.98); }

    .panel button:hover item, .panel button:hover player-head { animation: bob 500ms ease-in-out infinite; }

    .panel player-head {
      width: 12px;
      height: 12px;
      margin: 0 2px;
    }

    .row { display: flex; gap: 4px; }
    .row button { justify-content: center; }
    .row .half { flex: 1; width: auto; }
    .row .icon { width: 20px; padding: 0; }

    footer {
      position: absolute;
      left: 4px;
      right: 4px;
      bottom: 3px;
      display: flex;
      justify-content: space-between;
      color: rgba(255, 255, 255, 0.75);
      text-shadow: minecraft;
      animation: rise 500ms ease-out 1s both;
    }

    @media (prefers-reduced-motion: reduce) {
      .strip, .stars i, .meteor, .flies i, h1 span, .splash { animation: none; }
    }
  </style>
</head>
<body class="fullscreen">
  <div class="world">
    <div class="sky day"></div>
    <div class="sky dusk"></div>
    <div class="sky night"></div>
    <div class="stars" id="stars"></div>
    <i class="meteor"></i>
    <i class="moon"></i>
    <i class="bird" style="left: 92%; top: 30%; animation-delay: 0s, -7.5s"></i>
    <i class="bird" style="left: 95%; top: 33%; animation-delay: -120ms, -8.1s"></i>
    <i class="bird" style="left: 98%; top: 29%; animation-delay: -240ms, -8.9s"></i>
    <i class="glow"></i>
    <i class="sun"></i>
    <div class="range clouds" data-depth="2"><div class="strip"><div class="tile" id="clouds"></div></div></div>
    <div class="range far" data-depth="3"><div class="strip"><div class="tile" id="far"></div></div></div>
    <div class="range mid" data-depth="6"><div class="strip"><div class="tile" id="mid"></div></div></div>
    <div class="range near" data-depth="10"><div class="strip"><div class="tile" id="near"></div></div></div>
    <div class="flies" id="flies"></div>
    <div class="range front" data-depth="16"><div class="strip"><div class="tile" id="front"></div></div></div>
    <div class="scrim"></div>
  </div>

  <main>
    <div class="logo">
      <h1><span v-for="(letter, i) in 'VELLUM'.split('')" :style="{ animationDelay: 1200 + i * 80 + 'ms' }">{{ letter }}</span></h1>
      <div class="edition">HTML EDITION</div>
      <div class="splash" id="splash">Now with flexbox!</div>
    </div>

    <nav class="panel">
      <button onclick="vellum.close()"><item id="minecraft:iron_sword"></item>Singleplayer</button>
      <button><player-head></player-head>Multiplayer</button>
      <button><item id="minecraft:ender_eye"></item>Minecraft Realms</button>
      <div class="row">
        <button class="icon" title="Language"><sprite src="minecraft:icon/language"></sprite></button>
        <button class="half">Options...</button>
        <button class="half" onclick="vellum.close()">Quit Game</button>
        <button class="icon" title="Accessibility"><sprite src="minecraft:icon/accessibility"></sprite></button>
      </div>
    </nav>
  </main>

  <footer>
    <span>Vellum 1.0 (Minecraft 26.3)</span>
    <span>Copyright Nobody. Please distribute!</span>
  </footer>

  <div class="fade"></div>

  <script>
    // A tiny seeded random generator (an LCG), so the landscape is the same every time the page opens.
    function seeded(seed) {
      return function () {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      };
    }

    // Adds an <i> with the given class and inline style to a parent.
    function shape(parent, cls, css) {
      const el = document.createElement('i');
      el.className = cls;
      el.style.cssText = css;
      parent.appendChild(el);
      return el;
    }

    // Fills one tile with build(tile, random), then appends a copy of it so the strip loops without a seam.
    function tile(id, seed, build) {
      const first = document.getElementById(id);
      build(first, seeded(seed));
      first.parentNode.appendChild(first.cloneNode(true));
    }

    // Adds a shape at left %. One that may cross the tile's right edge also gets a twin a whole tile to the
    // left, so the part that hangs over the seam is there on both sides of it.
    function twin(parent, cls, left, css) {
      shape(parent, cls, `left:${left}%;${css}`);
      if (left > 80) shape(parent, cls, `left:${left - 100}%;${css}`);
    }

    // Clouds: [left %, top %, width px]; each is a slab with a narrower slab on top.
    tile('clouds', 7, t => {
      [[4, 30, 40], [30, 10, 30], [52, 24, 56], [66, 9, 34], [84, 18, 46], [95, 33, 28]].forEach(([left, top, width]) => {
        twin(t, '', left, `top:${top}%; width:${width}px;`);
        twin(t, '', left + 1.5, `top:calc(${top}% - 4px); width:${Math.round(width * 0.5)}px;`);
      });
    });

    // Far peaks are placed by hand: [left %, size px], each half sunk into the base. The sun sets in the valley
    // between the two big ones.
    tile('far', 11, t => {
      [[-4, 84], [9, 60], [18, 100], [31, 70], [42, 88], [55, 128], [80, 112], [93, 70]].forEach(([left, size]) => {
        twin(t, '', left, `bottom:calc(var(--base) - ${size / 2}px); width:${size}px; height:${size}px;`);
      });
    });

    // Mid hills: rounded diamonds of random sizes, every 11% or so.
    tile('mid', 23, (t, r) => {
      for (let i = 0; i < 9; i++) {
        const size = 48 + Math.round(r() * 56);
        twin(t, '', i * 11 + r() * 6, `bottom:calc(var(--base) - ${Math.round(size / 2)}px); width:${size}px; height:${size}px;`);
      }
    });

    // The forest: walk along the tile in small random steps (with the odd clearing) so the trees bunch into
    // groves; tree size follows a sine of the position, so groves swell and thin out. A tree's 3px box sits
    // 24px above its foot, and some sink a little lower for an uneven treeline.
    tile('near', 5, (t, r) => {
      for (let x = 0; x < 100; x += 0.8 + r() * 2.2) {
        if (r() < 0.08) x += 4;
        const swell = 0.5 + 0.5 * Math.sin(x * 0.19), scale = (0.55 + swell * 0.7 + r() * 0.35).toFixed(2);
        twin(t, r() < 0.4 ? 'tree wide' : 'tree', x,
          `bottom:calc(var(--base) + ${24 - Math.round(r() * 4)}px); transform: scale(${scale});`);
      }
    });

    // Foreground: 64 voxel columns whose heights take a random walk in 4px steps.
    tile('front', 3, (t, r) => {
      let h = 10;
      for (let i = 0; i < 64; i++) {
        h = Math.max(4, Math.min(30, h + Math.round((r() - 0.5) * 3) * 4));
        shape(t, '', `left:${i * 100 / 64}%; width:calc(${100 / 64}% + 1px); height:${h}px;`);
      }
    });

    // Stars and fireflies with random timings, so no two twinkle together.
    const random = seeded(42);
    const stars = document.getElementById('stars');
    for (let i = 0; i < 42; i++) {
      shape(stars, random() < 0.2 ? 'big' : '', `left:${(random() * 100).toFixed(1)}%; top:${(random() * 100).toFixed(1)}%;
        animation-duration:${(1.5 + random() * 3).toFixed(2)}s; animation-delay:${(-random() * 4).toFixed(2)}s;`);
    }
    const flies = document.getElementById('flies');
    for (let i = 0; i < 12; i++) {
      shape(flies, '', `left:${(40 + random() * 58).toFixed(1)}%; bottom:${(8 + random() * 14).toFixed(1)}%;
        animation-duration:${(4 + random() * 4).toFixed(2)}s; animation-delay:${(-random() * 8).toFixed(2)}s;`);
    }

    // A random splash, like the real thing.
    const splashes = ['Now with flexbox!', 'Also try CSS Grid!', 'Made of divs!', 'No canvas used!',
      'Painted by the game!', '100% HTML!', 'Square sun!', 'z-index: 9001!', 'Ctrl+Shift+I!', 'Hot reload!'];
    document.getElementById('splash').textContent = splashes[Math.floor(Math.random() * splashes.length)];

    // Mouse parallax: nearer ranges move further. The CSS transition smooths the motion.
    const ranges = document.querySelectorAll('.range');
    document.addEventListener('mousemove', e => {
      const dx = e.clientX / innerWidth - 0.5, dy = e.clientY / innerHeight - 0.5;
      ranges.forEach(range => {
        const depth = Number(range.dataset.depth);
        range.style.transform = `translate(${(-dx * depth).toFixed(1)}px, ${(-dy * depth * 0.4).toFixed(1)}px)`;
      });
    });

    document.querySelectorAll('button').forEach(b => b.addEventListener('mouseenter', () => {
      vellum.playSound('minecraft:ui.button.click', 0.15, 1.8);
    }));
  </script>
</body>
</html>
