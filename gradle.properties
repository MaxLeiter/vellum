# Important: every field used in resource templates must be added to the expandProps map in
# build-logic/src/main/groovy/multiloader-common.gradle

# Project
version=0.2.4
group=dev.vellum
java_version=25
# The pure-Java engine is compiled for this release so it can also ship in a 1.21.1 (Java 21) port
# and run in the standalone previewer.
engine_java_release=21

# Common
minecraft_version=26.3
mod_name=Vellum
mod_author=Max Leiter
mod_id=vellum
license=MIT
credits=
description=A small web engine for Minecraft GUIs: HTML, CSS (flexbox, grid, transitions, animations) and scripting, painted with Minecraft's own renderer.
minecraft_version_range=[26.3, 26.4)
neo_form_version=26.3-1

# Fabric, see https://fabricmc.net/develop/
fabric_version=0.161.0+26.3
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.26-beta
neoforge_loader_version_range=[4,)

# engine: Minecraft bundles Gson at runtime (2.14 on 26.3, 2.10.1 on 1.21.1), so the engine compiles against the older one
gson_version=2.10.1
junit_version=6.1.3
# Mozilla Rhino (MPL-2.0), relocated into dev.vellum.shadow.rhino by :rhino
rhino_version=1.9.1

# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.caching=true
