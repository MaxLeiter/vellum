# Important: every field used in resource templates must be added to the expandProps map in
# build-logic/src/main/groovy/multiloader-common.gradle
# Per-Minecraft-version settings (Minecraft, Java, loader and API versions) are in stonecutter.properties.toml.

# Project
version=0.4.1
group=dev.vellum
# The toolchain of the version-independent modules (engine, rhino, preview).
java_version=25
# The pure-Java engine is compiled for this release so it also runs on 1.21.1 (Java 21) and in the standalone
# previewer.
engine_java_release=21

# Common
mod_name=Vellum
mod_author=Max Leiter
mod_id=vellum
license=MIT
credits=
description=A small web engine for Minecraft GUIs: HTML, CSS (flexbox, grid, transitions, animations) and scripting, painted with Minecraft's own renderer.

# Publishing (build-logic multiloader-publish.gradle, .github/workflows/release.yml)
# The project ids from each site's project settings: Modrinth's is the 8-character id ("Copy ID" in the project
# menu), CurseForge's the number under "About Project". Left empty until the projects exist; publishing stops if
# either is empty. The tokens are never kept here: they come from the environment (MODRINTH_TOKEN, CURSEFORGE_TOKEN).
modrinth_id=VubPz2qI
curseforge_id=1729464
# The release type of versions without an -alpha or -beta suffix: alpha, beta or release. Beta while Vellum is 0.x.
release_type=release

# engine: Minecraft bundles Gson at runtime (2.14 on 26.3, 2.10.1 on 1.21.1), so the engine compiles against the older one
gson_version=2.10.1
junit_version=6.1.3
# Mozilla Rhino (MPL-2.0), built by :rhino from the source of this upstream commit (tag Rhino1_9_1_Release) with the
# patches in rhino/patches, and relocated into dev.vellum.shadow.rhino. rhino_sha256 is that of the GitHub archive.
rhino_commit=8527ebbf6d0b1599f819b5001af06e5dd9147013
rhino_sha256=ffe526540c407fc1b9005e963241a66b68b9417cfbda3d860d1622c547f2ecb0

# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.caching=true
# The build scripts are Groovy; this silences Stonecutter's suggestion to move them to Kotlin.
dev.kikugie.stonecutter.hard_mode=true
